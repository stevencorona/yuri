[package]
name = "common"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
libc = { workspace = true }
md-5 = { version = "0.10.6", features = ["asm"] }
faster-hex = "0.9"
fastrand = "2.3"

[dev-dependencies]
hexdump = "0.1.2"
criterion = { version = "0.7", features = ["html_reports"] }

[build-dependencies]
cc = { workspace = true }
pkg-config = { workspace = true }

[[bench]]
name = "cipher_bench"
harness = false
